<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আলটিমেট এইচডি পিকচার এডিটর প্রো</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* প্রধান লেআউট */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        /* বাম পাশের টুলবার */
        .sidebar {
            width: 340px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #1f2937;
            text-align: center;
        }
        .sidebar-header h2 {
            font-size: 20px;
            color: #38bdf8;
            font-weight: 700;
        }
        .tool-tabs {
            display: flex;
            background: #1f2937;
            padding: 4px;
            margin: 15px;
            border-radius: 8px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        .control-panel {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
        }
        .panel-content {
            display: none;
        }
        .panel-content.active {
            display: block;
        }
        /* প্রিভিউ এরিয়া */
        .main-content {
            flex: 1;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: auto;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 75vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background-image: repeating-conic-gradient(#1e293b 0% 25%, #334155 0% 50%);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            border-radius: 4px;
        }
        /* ফাইল আপলোড ও টপ বার */
        .top-bar {
            height: 60px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .file-upload-btn {
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .file-upload-btn:hover { background: #1d4ed8; }
        #image-loader { display: none; }
        
        .download-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #059669; }

        /* UI উপাদানসমূহ */
        .control-group {
            margin-top: 16px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 6px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
            background: #374151;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }
        /* রেডিমেড ফিল্টার গ্রিড */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .filter-card {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .filter-card:hover {
            border-color: #38bdf8;
            background: #2563eb22;
        }
        /* বাটন গ্রিড */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .action-btn {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #4b5563; }
        
        /* রিসেট বাটন */
        .reset-btn {
            width: 100%;
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-top: 25px;
            transition: background 0.2s;
        }
        .reset-btn:hover { background: #b91c1c; }

        /* নোটিফিকেশন বা ড্রপ জোন টেক্সট */
        .no-image-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #6b7280;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- বাম পাশের কন্ট্রোল প্যানেল -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>এইচডি ফটো এডিটর প্রো</h2>
        </div>
        
        <!-- ট্যাব অপশন -->
        <div class="tool-tabs">
            <button class="tab-btn active" onclick="switchTab('adjust')">অ্যাডজাস্ট</button>
            <button class="tab-btn" onclick="switchTab('filters')">ইফেক্টস</button>
            <button class="tab-btn" onclick="switchTab('tools')">টুলস</button>
        </div>

        <div class="control-panel">
            <!-- ট্যাব ১: অ্যাডজাস্টমেন্টস -->
            <div id="tab-adjust" class="panel-content active">
                <div class="control-group">
                    <label><span>ব্রাইটনেস (Brightness)</span><span id="lbl-brightness">100%</span></label>
                    <input type="range" id="brightness" min="0" max="200" value="100" oninput="updateImage()">
                </div>
                <div class="control-group">
                    <label><span>কনট্রাস্ট (Contrast)</span><span id="lbl-contrast">100%</span></label>
                    <input type="range" id="contrast" min="0" max="200" value="100" oninput="updateImage()">
                </div>
                <div class="control-group">
                    <label><span>স্যাচুরেশন (Saturation)</span><span id="lbl-saturation">100%</span></label>
                    <input type="range" id="saturation" min="0" max="200" value="100" oninput="updateImage()">
                </div>
                <div class="control-group">
                    <label><span>ব্লার (Blur)</span><span id="lbl-blur">0px</span></label>
                    <input type="range" id="blur" min="0" max="20" value="0" oninput="updateImage()">
                </div>
                <div class="control-group">
                    <label><span>এক্সপোজার (Exposure)</span><span id="lbl-exposure">0%</span></label>
                    <input type="range" id="exposure" min="-100" max="100" value="0" oninput="updateImage()">
                </div>
            </div>

            <!-- ট্যাব ২: রেডিমেড ইফেক্টস -->
            <div id="tab-filters" class="panel-content">
                <p style="font-size: 13px; color: #9ca3af;">একটি রেডিমেড ফিল্টার সিলেক্ট করুন:</p>
                <div class="filter-grid">
                    <div class="filter-card" onclick="applyPreset('normal')">স্বাভাবিক (Normal)</div>
                    <div class="filter-card" onclick="applyPreset('vintage')">ভিন্টেজ (Vintage)</div>
                    <div class="filter-card" onclick="applyPreset('bw')">সাদা-কালো (B&W)</div>
                    <div class="filter-card" onclick="applyPreset('sepia')">সেপিয়া (Sepia)</div>
                    <div class="filter-card" onclick="applyPreset('dramatic')">ড্রামাটিক (Dramatic)</div>
                    <div class="filter-card" onclick="applyPreset('cool')">শীতল (Cool)</div>
                    <div class="filter-card" onclick="applyPreset('warm')">উষ্ণ (Warm)</div>
                    <div class="filter-card" onclick="applyPreset('invert')">উল্টো রঙ (Invert)</div>
                </div>
            </div>

            <!-- ট্যাব ৩: টুলস -->
            <div id="tab-tools" class="panel-content">
                <p style="font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #d1d5db;">রোটেশন ও ফ্লিপ:</p>
                <div class="action-grid">
                    <button class="action-btn" onclick="rotateImage()">ঘোরান (Rotate)</button>
                    <button class="action-btn" onclick="flipImage()">ফ্লিপ (Flip)</button>
                </div>
            </div>

            <!-- রিসেট বাটন -->
            <button class="reset-btn" onclick="resetSettings()">সব পরিবর্তন রিমুভ করুন</button>
        </div>
    </div>

    <!-- মূল প্রিভিউ এরিয়া -->
    <div class="main-content">
        <div class="top-bar">
            <label for="image-loader" class="file-upload-btn">ছবি আপলোড করুন</label>
            <input type="file" id="image-loader" accept="image/*">
            
            <button class="download-btn" onclick="downloadImage()">ডাউনলোড এইচডি</button>
        </div>

        <div class="canvas-container">
            <div id="placeholder" class="no-image-placeholder">
                <h3>কোনো ছবি আপলোড করা হয়নি</h3>
                <p>শুরু করতে ওপরের "ছবি আপলোড করুন" বাটনে ক্লিক করুন</p>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </div>
</div>

<script>
    const imageLoader = document.getElementById('image-loader');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholder');

    let img = new Image();
    let isImageLoaded = false;
    let rotation = 0;
    let scaleX = 1;

    // ট্যাব পরিবর্তন ফাংশন
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.panel-content').forEach(panel => panel.classList.remove('active'));

        if(tabName === 'adjust') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-adjust').classList.add('active');
        } else if(tabName === 'filters') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-filters').classList.add('active');
        } else if(tabName === 'tools') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('tab-tools').classList.add('active');
        }
    }

    // ছবি লোড করা
    imageLoader.addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = function(event) {
            img = new Image();
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                isImageLoaded = true;
                placeholder.style.display = 'none';
                resetSettings();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    // ইমেজ আপডেট এবং ফিল্টার অ্যাপ্লাই করা
    function updateImage() {
        if (!isImageLoaded) return;

        const brightness = document.getElementById('brightness').value;
        const contrast = document.getElementById('contrast').value;
        const saturation = document.getElementById('saturation').value;
        const blur = document.getElementById('blur').value;
        const exposure = document.getElementById('exposure').value;

        // লেবেল আপডেট
        document.getElementById('lbl-brightness').innerText = brightness + '%';
        document.getElementById('lbl-contrast').innerText = contrast + '%';
        document.getElementById('lbl-saturation').innerText = saturation + '%';
        document.getElementById('lbl-blur').innerText = blur + 'px';
        document.getElementById('lbl-exposure').innerText = exposure + '%';

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        // ফিল্টার স্টাইল ক্যানভাসে সেট করা
        ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) blur(${blur}px) hue-rotate(${exposure}deg)`;
        
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.scale(scaleX, 1);
        
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        ctx.restore();
    }

    // রেডিমেড ফিল্টার প্রিসেট
    function applyPreset(type) {
        if (!isImageLoaded) return;
        
        const b = document.getElementById('brightness');
        const c = document.getElementById('contrast');
        const s = document.getElementById('saturation');
        const bl = document.getElementById('blur');
        const e = document.getElementById('exposure');

        if(type === 'normal') {
            b.value = 100; c.value = 100; s.value = 100; bl.value = 0; e.value = 0;
        } else if(type === 'vintage') {
            b.value = 110; c.value = 120; s.value = 70; bl.value = 0; e.value = 15;
        } else if(type === 'bw') {
            b.value = 100; c.value = 130; s.value = 0; bl.value = 0; e.value = 0;
        } else if(type === 'sepia') {
            b.value = 105; c.value = 110; s.value = 40; bl.value = 0; e.value = 25;
        } else if(type === 'dramatic') {
            b.value = 90; c.value = 160; s.value = 120; bl.value = 0; e.value = 0;
        } else if(type === 'cool') {
            b.value = 105; c.value = 110; s.value = 110; bl.value = 0; e.value = 180;
        } else if(type === 'warm') {
            b.value = 110; c.value = 100; s.value = 130; bl.value = 0; e.value = 35;
        } else if(type === 'invert') {
            ctx.filter = `invert(100%)`;
        }
        
        if(type !== 'invert') {
            updateImage();
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
        }
    }

    // রোটেট করা
    function rotateImage() {
        if (!isImageLoaded) return;
        rotation = (rotation + 90) % 360;
        updateImage();
    }

    // ফ্লিপ করা
    function flipImage() {
        if (!isImageLoaded) return;
        scaleX *= -1;
        updateImage();
    }

    // রিসেট সেটিংস
    function resetSettings() {
        if (!isImageLoaded) return;
        document.getElementById('brightness').value = 100;
        document.getElementById('contrast').value = 100;
        document.getElementById('saturation').value = 100;
        document.getElementById('blur').value = 0;
        document.getElementById('exposure').value = 0;
        rotation = 0;
        scaleX = 1;
        updateImage();
    }

    // ছবি ডাউনলোড করা
    function downloadImage() {
        if (!isImageLoaded) {
            alert("দয়া করে প্রথমে একটি ছবি আপলোড করুন!");
            return;
        }
        const link = document.createElement('a');
        link.download = 'edited-image-hd.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
